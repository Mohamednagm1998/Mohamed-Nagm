<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دعوة زفاف محمد & رغدة الملكية</title>

  <!-- إعدادات معاينة الرابط على واتساب ومنصات التواصل (Open Graph) -->
  <meta property="og:title" content="دعوة زفاف محمد & رغدة 💍✨">
  <meta property="og:description" content="نتشرف بدعوتكم لحضور حفل زفافنا | السبت 16 يناير 2027 - قاعة قصر الشوق دار الأسلحة والذخيرة">
  <meta property="og:image" content="https://mohamednagm1998.github.io/Mohamed-Nagm/couple.jpg">
  <meta property="og:url" content="https://mohamednagm1998.github.io/Mohamed-Nagm/">
  <meta property="og:type" content="website">

  <!-- خطوط عربية فاخرة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #C5A059;
      --gold-light: #F6E6C4;
      --gold-bright: #E2BC72;
      --gold-dark: #8E6823;
      --gold-glow: rgba(197, 160, 89, 0.28);
      --gold-gradient: linear-gradient(135deg, #F9E7BE 0%, #D4AF37 45%, #A87B1C 85%, #664B0B 100%);
      --bg-midnight: #090D15;
      --cream-paper: #FCFAF6;
      --card-white: #FFFFFF;
      --text-dark: #272019;
      --text-muted: #70685E;
      --envelope-cream: #FFFDF9;
      --envelope-shade: #F2E5CD;
      --envelope-deep: #E2D0AE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at 50% 18%, #141E2E 0%, #080C14 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 16px 10px 48px;
    }

    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 720px;
      height: 720px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(244, 215, 222, 0.04) 45%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    #petals-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    /* شاشة المظروف الافتتاحية الملكية الفاتحة */
    #envelope-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 22%, #FFFDF9 0%, #FAF4E8 52%, #EDE0CA 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      perspective: 1200px;
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.85s;
      padding: 20px 10px;
      overflow: hidden;
    }

    #envelope-screen::before {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(248, 218, 224, 0.45) 0%, rgba(255, 248, 230, 0.6) 45%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    #envelope-screen.opened {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-header {
      text-align: center;
      margin-bottom: 22px;
      animation: gentleHover 3.5s infinite ease-in-out;
      z-index: 10;
    }

    @keyframes gentleHover {
      0%, 100% { transform: translateY(0); opacity: 0.96; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    .badge-royal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.16);
      border: 1.5px solid rgba(197, 160, 89, 0.55);
      color: var(--gold-dark);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(197, 160, 89, 0.15);
    }

    .envelope-title {
      font-family: 'Amiri', serif;
      font-size: 2.85rem;
      font-weight: 700;
      color: var(--gold-dark);
      text-shadow: 0 3px 18px rgba(197, 160, 89, 0.35);
      line-height: 1.25;
    }

    .envelope-sub {
      color: #6C5F51;
      font-size: 0.96rem;
      font-weight: 600;
      margin-top: 5px;
    }

    .envelope-floral-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      z-index: 5;
    }

    .floral-cluster {
      position: absolute;
      pointer-events: none;
      z-index: 12;
      filter: drop-shadow(0 12px 22px rgba(142, 104, 35, 0.22));
    }

    .floral-top-left {
      top: -48px;
      left: -48px;
      width: 150px;
      height: 150px;
      animation: floralSway 5.5s infinite ease-in-out alternate;
      transform-origin: top left;
    }

    .floral-bottom-right {
      bottom: -48px;
      right: -48px;
      width: 155px;
      height: 155px;
      animation: floralSway 6.5s infinite ease-in-out alternate-reverse;
      transform-origin: bottom right;
    }

    .floral-top-right {
      top: -38px;
      right: -36px;
      width: 110px;
      height: 110px;
      animation: floralSway 5s infinite ease-in-out alternate;
      transform-origin: top right;
    }

    .floral-bottom-left {
      bottom: -36px;
      left: -36px;
      width: 110px;
      height: 110px;
      animation: floralSway 6s infinite ease-in-out alternate-reverse;
      transform-origin: bottom left;
    }

    @keyframes floralSway {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.02); }
      100% { transform: rotate(-1.5deg) scale(0.99); }
    }

    @media (max-width: 480px) {
      .floral-top-left { top: -32px; left: -28px; width: 115px; height: 115px; }
      .floral-bottom-right { bottom: -32px; right: -28px; width: 120px; height: 120px; }
      .floral-top-right { top: -26px; right: -22px; width: 88px; height: 88px; }
      .floral-bottom-left { bottom: -26px; left: -22px; width: 88px; height: 88px; }
    }

    .envelope-box {
      position: relative;
      width: 320px;
      height: 220px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
      z-index: 5;
    }

    @media (min-width: 480px) {
      .envelope-box {
        width: 390px;
        height: 255px;
      }
    }

    .envelope-box:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .envelope-shell {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #FFFFFF 0%, #FAF3E6 60%, #EFE1C5 100%);
      border-radius: 16px;
      box-shadow: 0 32px 75px rgba(142, 104, 35, 0.28), 0 8px 24px rgba(0, 0, 0, 0.08), inset 0 0 25px rgba(212, 175, 55, 0.18);
      border: 1.8px solid rgba(197, 160, 89, 0.75);
      overflow: hidden;
    }

    .envelope-fold-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 0 110px 160px;
      border-color: transparent transparent transparent var(--envelope-shade);
      z-index: 2;
    }

    .envelope-fold-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 160px 110px 0;
      border-color: transparent var(--envelope-shade) transparent transparent;
      z-index: 2;
    }

    @media (min-width: 480px) {
      .envelope-fold-left { border-width: 128px 0 128px 195px; }
      .envelope-fold-right { border-width: 128px 195px 128px 0; }
    }

    .envelope-fold-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 160px 120px 160px;
      border-color: transparent transparent var(--envelope-deep) transparent;
      z-index: 3;
    }

    @media (min-width: 480px) {
      .envelope-fold-bottom { border-width: 0 195px 145px 195px; }
    }

    .envelope-fold-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 125px 160px 0 160px;
      border-color: #ECE0C7 transparent transparent transparent;
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      filter: drop-shadow(0 6px 12px rgba(142, 104, 35, 0.24));
    }

    @media (min-width: 480px) {
      .envelope-fold-top { border-width: 145px 195px 0 195px; }
    }

    .envelope-box.is-opening .envelope-fold-top {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-card-inside {
      position: absolute;
      top: 15px;
      left: 18px;
      right: 18px;
      bottom: 15px;
      background: linear-gradient(135deg, #FFFFFF 0%, #FDFBF7 100%);
      border-radius: 12px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(197, 160, 89, 0.45);
      transition: transform 0.9s 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    .envelope-box.is-opening .envelope-card-inside {
      transform: translateY(-118px) scale(1.04);
    }

    .wax-ribbon-tail {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 48px;
      background: linear-gradient(180deg, #D4AF37 0%, #A87B1C 60%, #6E4E0B 100%);
      z-index: 6;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .wax-ribbon-left {
      left: calc(50% - 10px);
      transform: rotate(18deg);
      transform-origin: top center;
    }

    .wax-ribbon-right {
      right: calc(50% - 10px);
      transform: rotate(-18deg);
      transform-origin: top center;
    }

    .envelope-box.is-opening .wax-ribbon-tail {
      opacity: 0;
      transform: scale(0.2);
    }

    .wax-seal {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82px;
      height: 82px;
      background: radial-gradient(circle at 35% 35%, #F7D785 0%, #D4AF37 45%, #996D12 85%, #594008 100%);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFF9E8;
      font-family: 'Amiri', serif;
      box-shadow: 0 12px 30px rgba(142, 104, 35, 0.45), inset 0 2px 6px rgba(255, 255, 255, 0.8), inset 0 -4px 8px rgba(0, 0, 0, 0.4);
      border: 2px dashed rgba(255, 245, 206, 0.8);
      z-index: 7;
      cursor: pointer;
      transition: all 0.4s ease;
      animation: sealPulse 2.4s infinite alternate;
    }

    @keyframes sealPulse {
      0% { box-shadow: 0 8px 22px rgba(153, 109, 18, 0.35); transform: translate(-50%, -50%) scale(1); }
      100% { box-shadow: 0 14px 38px rgba(212, 175, 55, 0.65); transform: translate(-50%, -50%) scale(1.06); }
    }

    .envelope-box.is-opening .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
    }

    .btn-open-prompt {
      margin-top: 24px;
      background: var(--gold-gradient);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      padding: 13px 30px;
      border-radius: 35px;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 25px rgba(142, 104, 35, 0.38);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .btn-open-prompt:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(142, 104, 35, 0.5);
    }

    .card-container {
      width: 100%;
      max-width: 540px;
      z-index: 20;
      position: relative;
    }

    .wedding-card {
      background: var(--cream-paper);
      border-radius: 28px;
      padding: 38px 22px 32px;
      text-align: center;
      position: relative;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(197, 160, 89, 0.22);
      border: 2px solid rgba(197, 160, 89, 0.45);
      overflow: hidden;
    }

    .card-inner-frame {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 20px;
      pointer-events: none;
    }

    .card-inner-frame::before,
    .card-inner-frame::after {
      content: "✦";
      position: absolute;
      color: var(--gold-primary);
      font-size: 0.95rem;
    }
    .card-inner-frame::before { top: 6px; right: 8px; }
    .card-inner-frame::after { bottom: 6px; left: 8px; }

    .top-controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    .btn-chip {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.4);
      color: var(--gold-dark);
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.25s;
    }

    .btn-chip:hover {
      background: #F8F3E5;
      border-color: var(--gold-primary);
    }

    .btn-chip.active {
      background: rgba(229, 140, 157, 0.15);
      border-color: #E58C9D;
      color: #9C334A;
    }

    .audio-player-pill {
      background: linear-gradient(135deg, #FFFFFF 0%, #FDF9EE 100%);
      border: 1.5px solid var(--gold-primary);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 18px rgba(197, 160, 89, 0.18);
    }

    .audio-pill-info {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
    }

    .audio-disc-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.4);
      animation: spinDisc 8s linear infinite;
      animation-play-state: paused;
    }

    .audio-disc-icon.playing {
      animation-play-state: running;
    }

    @keyframes spinDisc {
      100% { transform: rotate(360deg); }
    }

    .audio-text-group {
      display: flex;
      flex-direction: column;
    }

    .audio-song-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .audio-song-status {
      font-size: 0.72rem;
      color: var(--gold-dark);
      font-weight: 600;
    }

    .audio-actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-audio-toggle {
      background: var(--gold-gradient);
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 12px rgba(197, 160, 89, 0.35);
      font-family: 'Cairo', sans-serif;
      transition: all 0.25s;
    }

    .btn-audio-toggle:hover {
      transform: scale(1.04);
    }

    .sound-equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
    }

    .eq-bar {
      width: 2.5px;
      background: #FFFFFF;
      border-radius: 2px;
      height: 3px;
    }

    .playing .eq-bar:nth-child(1) { animation: eqJump 0.8s infinite ease-in-out alternate; }
    .playing .eq-bar:nth-child(2) { animation: eqJump 1.1s infinite ease-in-out alternate 0.2s; }
    .playing .eq-bar:nth-child(3) { animation: eqJump 0.7s infinite ease-in-out alternate 0.4s; }

    @keyframes eqJump {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--gold-dark);
      margin-bottom: 12px;
    }

    .quran-box {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.35);
      border-right: 4px solid var(--gold-primary);
      border-left: 4px solid var(--gold-primary);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .quran-verse {
      font-family: 'Amiri', serif;
      font-size: 1.15rem;
      line-height: 2.1;
      color: var(--text-dark);
    }

    .quran-surah {
      display: block;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--gold-dark);
      font-weight: 700;
    }

    /* إطار صورة العروسين الملكي المقوس */
    .couple-frame-container {
      position: relative;
      margin: 10px auto 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .couple-photo-card {
      position: relative;
      width: 250px;
      max-width: 82%;
      padding: 7px;
      background: linear-gradient(145deg, #FFFDF8 0%, #F5ECDA 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 130px 130px 22px 22px;
      box-shadow: 0 14px 38px rgba(197, 160, 89, 0.28), 0 4px 12px rgba(0,0,0,0.06);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
    }

    .couple-photo-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 18px 45px rgba(197, 160, 89, 0.4);
    }

    .couple-photo-inner {
      width: 100%;
      border-radius: 124px 124px 16px 16px;
      overflow: hidden;
      position: relative;
      border: 1.5px solid rgba(197, 160, 89, 0.45);
      background: #FAF6ED;
    }

    .couple-photo-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .couple-crown-top {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold-gradient);
      color: #FFFFFF;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      border: 2px solid #FFFFFF;
      z-index: 3;
    }

    .couple-monogram-badge {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold-gradient);
      color: #FFFFFF;
      padding: 4px 18px;
      border-radius: 20px;
      font-family: 'Amiri', serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 18px rgba(197, 160, 89, 0.45);
      border: 2px solid #FFFFFF;
      z-index: 3;
      white-space: nowrap;
    }

    .wedding-title {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .couple-title-area {
      margin: 8px 0 14px;
    }

    .names-display {
      font-family: 'Amiri', serif;
      font-size: 3.3rem;
      font-weight: 700;
      color: var(--gold-dark);
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(197, 160, 89, 0.2);
    }

    .and-sym {
      font-family: 'Cairo', sans-serif;
      font-size: 1.9rem;
      color: var(--text-muted);
      margin: 0 8px;
    }

    .invitation-words {
      font-size: 0.98rem;
      line-height: 1.85;
      color: var(--text-muted);
      max-width: 440px;
      margin: 0 auto 24px;
    }

    .countdown-section {
      background: #FFFFFF;
      border: 1px solid rgba(197, 160, 89, 0.35);
      border-radius: 18px;
      padding: 16px 12px;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
    }

    .countdown-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .count-unit {
